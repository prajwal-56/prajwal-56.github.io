<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog post by Prajwal.">
  <title>blog — prajwal</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='monospace' fill='%237a8f65'%3E%3E%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">

    <nav id="site-nav" class="fade-in"></nav>

    <main>
      <div class="back-nav fade-in" style="--delay: 0.2s">
        <a href="blogs.html" class="back-link">&larr; blogs</a>
      </div>

      <h1 id="post-title" data-scramble>...</h1>
      <p id="post-meta" class="page-desc"></p>

      <div id="post-content" class="blog-content fade-in" style="--delay: 0.6s"></div>
    </main>

    <footer class="fade-in" style="--delay: 0.8s"></footer>

  </div>

  <script src="nav.js"></script>
  <script src="footer.js"></script>
  <script src="animate.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const postSlug = urlParams.get('post');

      if (!postSlug) {
        window.location.href = 'blogs.html';
        return;
      }

      fetch('blogs/index.json')
        .then(response => {
          if (!response.ok) throw new Error('Failed to load blog index');
          return response.json();
        })
        .then(posts => {
          const postMeta = posts.find(p => p.slug === postSlug);
          if (!postMeta) {
            document.getElementById('post-title').textContent = 'post not found';
            document.getElementById('post-content').innerHTML = '<p>The requested blog post could not be found.</p>';
            return;
          }

          document.title = `${postMeta.title} — prajwal`;
          
          const titleEl = document.getElementById('post-title');
          titleEl.textContent = '';
          const fx = new TextScramble(titleEl);
          fx.setText(postMeta.title);

          const metaEl = document.getElementById('post-meta');
          metaEl.setAttribute('data-typewriter', postMeta.date);
          setTimeout(() => {
            typewrite(metaEl, 28);
          }, 400);

          return fetch(`blogs/${postSlug}.md`);
        })
        .then(response => {
          if (!response) return;
          if (!response.ok) throw new Error('Failed to load blog content');
          return response.text();
        })
        .then(markdownText => {
          if (!markdownText) return;

          let processedText = markdownText.replace(/!\[\[(.*?)\]\]/g, '![$1](blogs/attachments/$1)');
          processedText = processedText.replace(/\[\[(.*?)\|(.*?)\]\]/g, '[$2](blog-post.html?post=$1)');
          processedText = processedText.replace(/\[\[(.*?)\]\]/g, '[$1](blog-post.html?post=$1)');

          const htmlContent = marked.parse(processedText);
          document.getElementById('post-content').innerHTML = htmlContent;
          initBlogImages(document.getElementById('post-content'));
        })
        .catch(err => {
          console.error(err);
          document.getElementById('post-title').textContent = 'error';
          document.getElementById('post-content').innerHTML = `<p>Failed to load the post: ${err.message}</p>`;
        });
    });
  </script>

  <script>
    /* ── blog image grouping + 3D tilt + lightbox ── */

    function initBlogImages(root) {
      if (!root) return;

      /* Step 1 — marked wraps bare <img> tags in <p>; unwrap them */
      root.querySelectorAll('p').forEach(p => {
        const kids = Array.from(p.children);
        if (kids.length > 0 && kids.every(el => el.tagName === 'IMG')) {
          kids.forEach(img => p.parentNode.insertBefore(img, p));
          p.remove();
        }
      });

      /* Step 2 — collect runs of consecutive top-level <img> nodes
         and wrap each run in an .img-group of .img-figure cards      */
      let run = [];

      function flushRun() {
        if (!run.length) return;
        const group = document.createElement('div');
        group.className = 'img-group';
        run[0].parentNode.insertBefore(group, run[0]);
        run.forEach(img => {
          const fig = document.createElement('div');
          fig.className = 'img-figure';
          if (img.title) fig.setAttribute('title', img.title);
          group.appendChild(fig);
          fig.appendChild(img);
        });
        run = [];
      }

      Array.from(root.childNodes).forEach(node => {
        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'IMG') {
          run.push(node);
        } else {
          flushRun();
        }
      });
      flushRun();

      /* Step 3 — wire up tilt + lightbox on ALL .img-figure elements
         (covers both pre-written HTML ones and dynamically created ones) */
      root.querySelectorAll('.img-figure').forEach(fig => {
        attachTilt(fig);
        attachLightbox(fig);
      });
    }

    /* ── 3D tilt ── */
    function attachTilt(fig) {
      const MAX = 8;

      fig.addEventListener('mousemove', e => {
        const r  = fig.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width  - 0.5;
        const ny = (e.clientY - r.top)  / r.height - 0.5;
        fig.style.setProperty('--ry',  (nx * MAX) + 'deg');
        fig.style.setProperty('--rx', (-ny * MAX) + 'deg');
        fig.style.setProperty('--sc', '1.035');
        fig.style.transition = 'box-shadow 0.2s ease, border-color 0.2s ease';
      });

      fig.addEventListener('mouseleave', () => {
        fig.style.setProperty('--rx', '0deg');
        fig.style.setProperty('--ry', '0deg');
        fig.style.setProperty('--sc', '1');
        fig.style.transition =
          'transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94),' +
          'box-shadow 0.25s ease, border-color 0.25s ease';
      });
    }

    /* ── lightbox ── */
    let lb = null; /* singleton overlay */

    function getLightbox() {
      if (lb) return lb;

      lb = document.createElement('div');
      lb.id = 'img-lightbox';
      lb.innerHTML = `
        <div class="lb-backdrop"></div>
        <div class="lb-panel">
          <img class="lb-img" src="" alt="">
          <p class="lb-caption"></p>
          <button class="lb-close" aria-label="close">✕</button>
        </div>
      `;
      document.body.appendChild(lb);

      /* close on backdrop or button */
      lb.querySelector('.lb-backdrop').addEventListener('click', closeLightbox);
      lb.querySelector('.lb-close').addEventListener('click', closeLightbox);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeLightbox();
      });

      return lb;
    }

    function openLightbox(src, caption) {
      const box   = getLightbox();
      const img   = box.querySelector('.lb-img');
      const cap   = box.querySelector('.lb-caption');
      const panel = box.querySelector('.lb-panel');

      img.src = src;
      cap.textContent = caption || '';
      cap.style.display = caption ? 'block' : 'none';

      /* reset panel transform for fresh entry animation */
      panel.style.transition = 'none';
      panel.style.transform  = 'translateY(18px) scale(0.96)';
      panel.style.opacity    = '0';

      box.classList.add('lb-open');
      document.body.style.overflow = 'hidden';

      /* trigger animation next frame */
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          panel.style.transition = 'transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.28s ease';
          panel.style.transform  = 'translateY(0) scale(1)';
          panel.style.opacity    = '1';
        });
      });
    }

    function closeLightbox() {
      if (!lb) return;
      const panel = lb.querySelector('.lb-panel');
      panel.style.transition = 'transform 0.25s ease, opacity 0.2s ease';
      panel.style.transform  = 'translateY(12px) scale(0.97)';
      panel.style.opacity    = '0';
      setTimeout(() => {
        lb.classList.remove('lb-open');
        document.body.style.overflow = '';
      }, 220);
    }

    function attachLightbox(fig) {
      fig.addEventListener('click', () => {
        const img     = fig.querySelector('img');
        const caption = fig.getAttribute('title') || (img && img.getAttribute('title')) || '';
        if (img) openLightbox(img.src, caption);
      });
    }
  </script>
</body>
</html>
